<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="718" viewBox="0 0 1200 718" role="img" aria-labelledby="title desc">
<title id="title">Clip Insights / Video question answering</title><desc id="desc">The retrieval path implemented by the backend chat service.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 z" fill="#4255ff"/></marker></defs>
<rect width="1200" height="718" fill="#ffffff"/>
<g font-family="Inter, Segoe UI, Arial, sans-serif">
<text x="48" y="54" font-size="32" font-weight="700" fill="#232738">Clip Insights / Video question answering</text><text x="48" y="88" font-size="18" font-weight="400" fill="#586174">The retrieval path implemented by the backend chat service.</text>
<text x="48" y="130" font-size="14" font-weight="650" fill="#586174">TRANSCRIPT INDEXING · REUSED FOR A VIDEO AND EMBEDDING MODEL</text><rect x="48" y="152" width="252" height="100" rx="12" fill="#f6f7fb" stroke="#d6dae5"/><text x="72" y="186" font-size="22" font-weight="650" fill="#232738">Transcript</text><text x="72" y="214" font-size="17" font-weight="400" fill="#586174">Video URL + supplied text</text><rect x="332" y="152" width="252" height="100" rx="12" fill="#f6f7fb" stroke="#d6dae5"/><text x="356" y="186" font-size="22" font-weight="650" fill="#232738">Chunking</text><text x="356" y="214" font-size="17" font-weight="400" fill="#586174">800 characters / 50 overlap</text><rect x="616" y="152" width="252" height="100" rx="12" fill="#f6f7fb" stroke="#d6dae5"/><text x="640" y="186" font-size="22" font-weight="650" fill="#232738">Embeddings</text><text x="640" y="214" font-size="17" font-weight="400" fill="#586174">Document vectors</text><rect x="900" y="152" width="252" height="100" rx="12" fill="#f6f7fb" stroke="#d6dae5"/><text x="924" y="186" font-size="22" font-weight="650" fill="#232738">Vector store</text><text x="924" y="214" font-size="17" font-weight="400" fill="#586174">Model ID + video URL key</text><path d="M 300 202 L 332 202" fill="none" stroke="#4255ff" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 584 202 L 616 202" fill="none" stroke="#4255ff" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 868 202 L 900 202" fill="none" stroke="#4255ff" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 1026 252 L 1026 302 L 742 302 L 742 376" fill="none" stroke="#4255ff" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="752" y="290" font-size="15" font-weight="500" fill="#586174">Cached transcript chunks</text><text x="48" y="348" font-size="14" font-weight="650" fill="#586174">QUESTION ANSWERING · RETRIEVE CONTEXT, THEN STREAM THE RESPONSE</text><rect x="48" y="376" width="252" height="100" rx="12" fill="#f6f7fb" stroke="#d6dae5"/><text x="72" y="410" font-size="22" font-weight="650" fill="#232738">Question</text><text x="72" y="438" font-size="17" font-weight="400" fill="#586174">User message + recent chat</text><rect x="332" y="376" width="252" height="100" rx="12" fill="#f6f7fb" stroke="#d6dae5"/><text x="356" y="410" font-size="22" font-weight="650" fill="#232738">Query embedding</text><text x="356" y="438" font-size="17" font-weight="400" fill="#586174">Vector for this question</text><rect x="616" y="376" width="252" height="100" rx="12" fill="#f6f7fb" stroke="#d6dae5"/><text x="640" y="410" font-size="22" font-weight="650" fill="#232738">Retrieval</text><text x="640" y="438" font-size="17" font-weight="400" fill="#586174">Top 3 transcript chunks</text><rect x="900" y="376" width="252" height="100" rx="12" fill="#eef0ff" stroke="#4255ff"/><rect x="900" y="392" width="4" height="68" rx="2" fill="#4255ff"/><text x="924" y="410" font-size="22" font-weight="650" fill="#232738">Language model</text><text x="924" y="438" font-size="17" font-weight="400" fill="#586174">Context + recent messages</text><path d="M 300 426 L 332 426" fill="none" stroke="#4255ff" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 584 426 L 616 426" fill="none" stroke="#4255ff" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 868 426 L 900 426" fill="none" stroke="#4255ff" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 1026 476 L 1026 536" fill="none" stroke="#4255ff" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="616" y="536" width="536" height="100" rx="12" fill="#f6f7fb" stroke="#d6dae5"/><text x="640" y="570" font-size="22" font-weight="650" fill="#232738">Streamed answer</text><text x="640" y="598" font-size="17" font-weight="400" fill="#586174">JSON-encoded tokens over server-sent events</text><text x="48" y="568" font-size="20" font-weight="650" fill="#232738">Retrieval fallback</text><text x="48" y="598" font-size="17" font-weight="400" fill="#586174">Up to 4,000 transcript characters</text><text x="48" y="624" font-size="17" font-weight="400" fill="#586174">when retrieval has no usable result.</text><text x="48" y="686" font-size="16" font-weight="400" fill="#586174">The API checks authentication and plan allowance before generation; chat carries up to 3 recent messages.</text>
</g></svg>