ont-weight="650" fill="#232738">Video AI services</text><text x="456" y="520" font-size="17" font-weight="400" fill="#586174">Structured summaries</text><text x="456" y="545" font-size="17" font-weight="400" fill="#586174">Transcript retrieval for chat</text><text x="456" y="570" font-size="17" font-weight="400" fill="#586174">Token-by-token responses</text><rect x="816" y="458" width="336" height="146" rx="12" fill="#f6f7fb" stroke="#d6dae5"/><text x="840" y="492" font-size="22" font-weight="650" fill="#232738">Plans and billing</text><text x="840" y="520" font-size="17" font-weight="400" fill="#586174">Rolling 24-hour usage</text><text x="840" y="545" font-size="17" font-weight="400" fill="#586174">Paddle checkout configuration</text><text x="840" y="570" font-size="17" font-weight="400" fill="#586174">Verified subscription webhooks</text><path d="M 216 604 L 216 670" fill="none" stroke="#4255ff" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 600 604 L 600 670" fill="none" stroke="#4255ff" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 984 604 L 984 670" fill="none" stroke="#4255ff" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="48" y="670" width="1104" height="110" rx="12" fill="#f6f7fb" stroke="#d6dae5"/><text x="72" y="704" font-size="22" font-weight="650" fill="#232738">Persistence and integration providers</text><text x="72" y="732" font-size="17" font-weight="400" fill="#586174">CockroachDB: accounts, metadata, plans, usage, subscriptions, vectors</text><text x="72" y="757" font-size="17" font-weight="400" fill="#586174">AWS S3: PDFs · Configured LLM and embedding providers · Email · Google OAuth · Paddle</text><text x="48" y="824" font-size="16" font-weight="400" fill="#586174">Analytics is a separate administrative module. /health/ provides a lightweight service health response.</text>
