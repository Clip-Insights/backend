<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="472" viewBox="0 0 1200 472" role="img" aria-labelledby="title desc">
<title id="title">Clip Insights / Asking about a video</title><desc id="desc">A simple view of how transcript retrieval supports the conversation.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 z" fill="#4255ff"/></marker></defs>
<rect width="1200" height="472" fill="#ffffff"/>
<g font-family="Inter, Segoe UI, Arial, sans-serif">
<text x="48" y="54" font-size="32" font-weight="700" fill="#232738">Clip Insights / Asking about a video</text><text x="48" y="88" font-size="18" font-weight="400" fill="#586174">A simple view of how transcript retrieval supports the conversation.</text>
<rect x="48" y="148" width="304" height="110" rx="12" fill="#f6f7fb" stroke="#d6dae5"/><text x="72" y="182" font-size="22" font-weight="650" fill="#232738">Video transcript</text><text x="72" y="210" font-size="17" font-weight="400" fill="#586174">The content of the video</text><text x="72" y="235" font-size="17" font-weight="400" fill="#586174">Prepared for retrieval</text><path d="M 352 202 L 448 202" fill="none" stroke="#4255ff" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="448" y="148" width="304" height="110" rx="12" fill="#eef0ff" stroke="#4255ff"/><rect x="448" y="164" width="4" height="78" rx="2" fill="#4255ff"/><text x="472" y="182" font-size="22" font-weight="650" fill="#232738">Relevant passages</text><text x="472" y="210" font-size="17" font-weight="400" fill="#586174">Find context for the question</text><text x="472" y="235" font-size="17" font-weight="400" fill="#586174">Use recent conversation</text><path d="M 752 202 L 848 202" fill="none" stroke="#4255ff" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="848" y="148" width="304" height="110" rx="12" fill="#f6f7fb" stroke="#d6dae5"/><text x="872" y="182" font-size="22" font-weight="650" fill="#232738">Streamed answer</text><text x="872" y="210" font-size="17" font-weight="400" fill="#586174">Generated with video context</text><text x="872" y="235" font-size="17" font-weight="400" fill="#586174">Appears as it is written</text><rect x="48" y="336" width="304" height="92" rx="12" fill="#f6f7fb" stroke="#d6dae5"/><text x="72" y="370" font-size="22" font-weight="650" fill="#232738">Your question</text><text x="72" y="398" font-size="17" font-weight="400" fill="#586174">Ask about what you are watching</text><path d="M 352 382 L 600 382 L 600 258" fill="none" stroke="#4255ff" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="672" y="376" font-size="21" font-weight="650" fill="#232738">Retrieval-augmented generation (RAG)</text><text x="672" y="410" font-size="17" font-weight="400" fill="#586174">Find useful context, then generate the response.</text>
</g></svg>